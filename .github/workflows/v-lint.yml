name: V Lint

env:
  VJOBS: '2'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.md'
      - '**.v'
      - '.github/workflows/v-lint.yml'

  pull_request:
    branches:
      - main
    paths:
      - '**.md'
      - '**.v'
      - '.github/workflows/v-lint.yml'

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    env:
      VJOBS: '2'
    steps:
      - name: Checkout VSL
        uses: actions/checkout@v7
        with:
          path: vsl
          fetch-depth: 0
      - name: Setup V
        uses: vlang/setup-v@v1.7
        with:
          check-latest: true
      - name: Install dependencies
        run: |
          sudo apt-get update && \
          sudo apt-get install --quiet -y --no-install-recommends \
            gfortran \
            libxi-dev \
            libxcursor-dev \
            mesa-common-dev \
            liblapacke-dev \
            libopenblas-dev \
            libgc-dev \
            libgl1-mesa-dev \
            libopenmpi-dev \
            libhdf5-dev \
            hdf5-tools \
            opencl-headers \
            ocl-icd-opencl-dev \
            libvulkan-dev
      - name: Setup VSL as V module
        run: |
          mkdir -p ~/.vmodules
          cp -a ./vsl ~/.vmodules/vsl
      - name: Select Markdown files
        id: markdown
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BASE_SHA"
          fi

          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            markdown_files="$(git -C vsl ls-files '*.md')"
          else
            changed_files="$(git -C vsl diff --name-only "$base" HEAD)"
            if grep -qE '\.v$' <<< "$changed_files"; then
              markdown_files="$(git -C vsl ls-files '*.md')"
            else
              markdown_files="$(git -C vsl diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.md')"
            fi
          fi

          {
            echo 'files<<EOF'
            echo "$markdown_files"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Validate Docs
        if: steps.markdown.outputs.files != ''
        env:
          MARKDOWN_FILES: ${{ steps.markdown.outputs.files }}
        run: |
          mapfile -t markdown_files <<< "$MARKDOWN_FILES"
          for i in "${!markdown_files[@]}"; do
            markdown_files[$i]="./vsl/${markdown_files[$i]}"
          done
          cd ~/.vmodules
          env HOME="$HOME" PATH="$PATH" VJOBS=2 \
            v check-md -hide-warnings "${markdown_files[@]}"
      - name: Skip Docs
        if: steps.markdown.outputs.files == ''
        run: echo "No Markdown files or V source files changed."

  fmt:
    runs-on: ubuntu-latest
    env:
      VJOBS: '2'
    steps:
      - name: Checkout VSL
        uses: actions/checkout@v7
        with:
          path: vsl
      - name: Setup V
        uses: vlang/setup-v@v1.7
        with:
          check-latest: true
      - name: Setup VSL as V module
        run: |
          mkdir -p ~/.vmodules
          cp -a ./vsl ~/.vmodules/vsl
      - name: Check Formatting
        run: |
          mapfile -t v_files < <(git -C ~/.vmodules/vsl ls-files '*.v' ':!:vulkan/spv.v')
          for i in "${!v_files[@]}"; do
            v_files[$i]="./vsl/${v_files[$i]}"
          done
          cd ~/.vmodules
          env HOME="$HOME" PATH="$PATH" VJOBS=2 \
            v fmt -verify "${v_files[@]}"
