name: Docker Publish

permissions: {}

on:
  workflow_call:
    inputs:
      target:
        description: "The target to use"
        type: string
        required: false
        default: ""
      build-args:
        description: "The build args to use"
        type: string
        required: false
        default: ""
      tags:
        description: "The tags to use"
        type: string
        required: false
        default: ""
    secrets:
      DOCKERHUB_USERNAME:
        description: "The username to use for the image"
        required: true
      DOCKERHUB_TOKEN:
        description: "The password to use for the image"
        required: true

jobs:
  docker-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          push: true
          tags: ${{ inputs.tags }}
          build-args: ${{ inputs.build-args }}
          target: ${{ inputs.target }}
