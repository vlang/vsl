name: VSL Continuous Integration

env:
  VJOBS: '2'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Main pushes are serialized to the newest revision, so rapid merges do not
  # leave stale workflows occupying the Actions queue.
  cancel-in-progress: true

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      run_cuda:
        description: 'Run CUDA tests (requires org GPU runner; not configured today)'
        type: boolean
        default: false

  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'static/DOCS.md'
      - 'docs/**'
      - 'examples/**/README.md'

  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'static/DOCS.md'
      - 'docs/**'
      - 'examples/**/README.md'

jobs:
  run-tests-on-linux:
    runs-on: ${{ matrix.os }}
    env:
      VJOBS: '2'

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            flags: ""
          - os: ubuntu-24.04
            flags: ""
          - os: ubuntu-24.04
            flags: "--prod"

    steps:
      - name: Checkout VSL
        uses: actions/checkout@v7
        with:
          path: vsl

      - name: Setup V
        uses: vlang/setup-v@v1.7
        with:
          check-latest: true

      - name: Move VSL source code to V Modules
        run: |
          mkdir -p ~/.vmodules
          mv ./vsl ~/.vmodules/vsl

      - name: V doctor
        run: |
          cd ~/.vmodules
          env HOME="$HOME" PATH="$PATH" VJOBS=2 v doctor

      - name: Install dependencies
        run: |
          sudo apt-get update && \
          sudo apt-get install --quiet -y --no-install-recommends \
            gfortran \
            libxi-dev \
            libxcursor-dev \
            mesa-common-dev \
            liblapacke-dev \
            libopenblas-dev \
            libgc-dev \
            libgl1-mesa-dev \
            libopenmpi-dev \
            libhdf5-dev \
            hdf5-tools \
            opencl-headers \
            ocl-icd-opencl-dev \
            vulkan-tools \
            mesa-vulkan-drivers \
            libvulkan-dev

      - name: Install PoCL OpenCL CPU runtime
        if: matrix.os == 'ubuntu-24.04' && matrix.flags == ''
        run: sudo apt-get install --quiet -y --no-install-recommends pocl-opencl-icd

      - name: Test OpenCL compute backend
        if: matrix.os == 'ubuntu-24.04' && matrix.flags == ''
        env:
          VJOBS: '2'
        run: |
          cd ~/.vmodules
          env HOME="$HOME" PATH="$PATH" VJOBS=2 \
            v -d vcl test vsl/vcl/compute

      - name: Test opt-in MPI API
        if: matrix.os == 'ubuntu-24.04' && matrix.flags == ''
        working-directory: /home/runner/.vmodules
        env:
          VJOBS: 2
        run: |
          env HOME="$HOME" PATH="$PATH" VJOBS=2 \
            v -d vsl_mpi -cc gcc test ./vsl/mpi
          env HOME="$HOME" PATH="$PATH" VJOBS=2 \
            mpirun --oversubscribe -n 2 v -d vsl_mpi -cc gcc run ./vsl/mpi/examples/roundtrip/main.v

      - name: Execute Tests using Pure V Backend
        run: |
          cd ~/.vmodules
          env HOME="$HOME" PATH="$PATH" VJOBS=2 v wipe-cache
          env HOME="$HOME" PATH="$PATH" VJOBS=2 TERM="$TERM" \
            "$HOME/.vmodules/vsl/bin/test" ${{ matrix.flags }} --use-cblas

      - name: Execute Tests using Pure V Backend with Pure C Backend
        run: |
          cd ~/.vmodules
          env HOME="$HOME" PATH="$PATH" VJOBS=2 v wipe-cache
          env HOME="$HOME" PATH="$PATH" VJOBS=2 TERM="$TERM" \
            "$HOME/.vmodules/vsl/bin/test" ${{ matrix.flags }} --use-cblas --use-lapacke

      - name: Execute Tests using Vulkan Compute Backend
        env:
          VSL_TEST_VULKAN: '1'
        run: |
          cd ~/.vmodules
          env HOME="$HOME" PATH="$PATH" VJOBS=2 TERM="$TERM" VSL_TEST_VULKAN=1 v wipe-cache
          env HOME="$HOME" PATH="$PATH" VJOBS=2 TERM="$TERM" VSL_TEST_VULKAN=1 \
            "$HOME/.vmodules/vsl/bin/test" ${{ matrix.flags }} --use-vulkan

  run-windows-smoke:
    name: Windows portable test suites
    runs-on: windows-latest
    env:
      VJOBS: '2'

    steps:
      - name: Checkout VSL
        uses: actions/checkout@v7
        with:
          path: vsl

      - name: Setup V
        uses: vlang/setup-v@v1.7
        with:
          check-latest: true

      - name: Move VSL source code to V Modules
        shell: bash
        run: |
          mkdir -p ~/.vmodules
          mv ./vsl ~/.vmodules/vsl

      - name: V doctor
        shell: bash
        run: |
          cd ~/.vmodules
          v doctor

      - name: Validate portable test runner
        shell: bash
        run: |
          cd ~/.vmodules
          bash -n vsl/bin/test
          vsl/bin/test --help

      - name: Install Vulkan headers (Windows)
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.3.296.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Run Windows compute smoke
        shell: bash
        run: |
          cd ~/.vmodules
          vulkan_root="${VULKAN_SDK//\\//}"
          export CFLAGS="-I${vulkan_root}/Include"
          export LIB="${vulkan_root}/Lib"
          cat > "$RUNNER_TEMP/vsl_windows_smoke.v" <<'EOF'
          import vsl.compute

          fn main() {
            assert compute.op_supported(.cpu, 'gemm')
          }
          EOF
          v run "$RUNNER_TEMP/vsl_windows_smoke.v"
          v test vsl/compute/context_test.v

      - name: Run portable Windows test suites
        shell: bash
        run: |
          cd ~/.vmodules
          v test \
            ./vsl/blas \
            ./vsl/blas/blas64 \
            ./vsl/compute \
            ./vsl/deriv \
            ./vsl/diff \
            ./vsl/dist \
            ./vsl/easings \
            ./vsl/errors \
            ./vsl/fft \
            ./vsl/fit \
            ./vsl/float/float32 \
            ./vsl/float/float64 \
            ./vsl/fun \
            ./vsl/func \
            ./vsl/gm \
            ./vsl/graph \
            ./vsl/inout/csv \
            ./vsl/iter \
            ./vsl/la \
            ./vsl/lapack \
            ./vsl/lapack/lapack64 \
            ./vsl/metrics \
            ./vsl/ml \
            ./vsl/model_selection \
            ./vsl/noise \
            ./vsl/plot \
            ./vsl/poly \
            ./vsl/preprocessing \
            ./vsl/prime \
            ./vsl/quaternion \
            ./vsl/roots \
            ./vsl/util

      - name: Test Vulkan compute on Windows
        shell: bash
        run: |
          cd ~/.vmodules
          vulkan_root="${VULKAN_SDK//\\//}"
          export CFLAGS="-I${vulkan_root}/Include"
          export LIB="${vulkan_root}/Lib"
          v test ./vsl/vulkan/compute

  run-tests-on-cuda:
    # CUDA needs an org larger/GPU runner (label was linux-x64-16c). Standard GitHub
    # hosted runners have no NVIDIA GPU. Do not run on main push — it queues forever
    # when no matching runner exists. Local: ./bin/test --use-cuda
    if: github.event_name == 'workflow_dispatch' && inputs.run_cuda == true
    runs-on: ubuntu-24.04
    env:
      VJOBS: '2'

    steps:
      - name: Checkout VSL
        uses: actions/checkout@v7
        with:
          path: vsl

      - name: Setup V
        uses: vlang/setup-v@v1.7
        with:
          check-latest: true

      - name: Move VSL source code to V Modules
        run: |
          mkdir -p ~/.vmodules
          mv ./vsl ~/.vmodules/vsl

      - name: V doctor
        run: |
          cd ~/.vmodules
          env HOME="$HOME" PATH="$PATH" VJOBS=2 v doctor

      - name: Install CUDA toolkit
        run: |
          sudo apt-get update && \
          sudo apt-get install --quiet -y --no-install-recommends \
            cuda-toolkit-12-2 \
            libcudnn8 libcudnn8-dev

      - name: Verify CUDA installation
        run: |
          nvcc --version
          nvidia-smi || echo "nvidia-smi not available in container (expected on some runners)"

      - name: Execute Tests using CUDA Backend
        run: |
          cd ~/.vmodules
          env HOME="$HOME" PATH="$PATH" VJOBS=2 v wipe-cache
          env HOME="$HOME" PATH="$PATH" VJOBS=2 TERM="$TERM" \
            "$HOME/.vmodules/vsl/bin/test" --use-cuda
          # Optional: GPU layernorm when cuDNN 9.1+ symbols are present
          env HOME="$HOME" PATH="$PATH" VJOBS=2 \
            env VSL_TEST_CUDA=1 v -d cuda -d cudnn_layernorm test vsl/cuda/compute/numerical_validation_test.v || true

  run-tests-on-macos:
    runs-on: ${{ matrix.os }}
    env:
      VJOBS: '2'

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            flags: ""
          - os: macos-latest
            flags: "--prod"

    steps:
      - name: Checkout VSL
        uses: actions/checkout@v7
        with:
          path: vsl

      - name: Setup V
        uses: vlang/setup-v@v1.7
        with:
          check-latest: true

      - name: Move VSL source code to V Modules
        run: |
          mkdir -p ~/.vmodules
          mv ./vsl ~/.vmodules/vsl

      - name: V doctor
        run: |
          cd ~/.vmodules
          v doctor

      - name: Install dependencies
        run: |
          brew install coreutils
          brew install gcc
          brew install libomp
          brew install hdf5
          brew install open-mpi
          brew install openblas
          brew install lapack
          brew install opencl-headers
          brew install vulkan-headers

      - name: Export Homebrew BLAS/LAPACK paths
        run: |
          OPENBLAS_PREFIX="$(brew --prefix openblas)"
          LAPACK_PREFIX="$(brew --prefix lapack)"
          {
            echo "CPPFLAGS=-I${OPENBLAS_PREFIX}/include -I${LAPACK_PREFIX}/include ${CPPFLAGS:-}"
            echo "CFLAGS=-I${OPENBLAS_PREFIX}/include -I${LAPACK_PREFIX}/include ${CFLAGS:-}"
            echo "LDFLAGS=-L${OPENBLAS_PREFIX}/lib -L${LAPACK_PREFIX}/lib ${LDFLAGS:-}"
            echo "PKG_CONFIG_PATH=${OPENBLAS_PREFIX}/lib/pkgconfig:${LAPACK_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          } >> "$GITHUB_ENV"

      - name: Execute Tests using Pure V Backend
        run: |
          cd ~/.vmodules
          v wipe-cache
          vsl/bin/test

      - name: Execute Tests using Pure V Backend with Pure C Backend
        run: |
          cd ~/.vmodules
          v wipe-cache
          vsl/bin/test --use-cblas --use-lapacke
