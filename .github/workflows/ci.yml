name: VSL Continuous Integration

permissions:
  contents: read

env:
  VJOBS: '2'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Main pushes are serialized to the newest revision, so rapid merges do not
  # leave stale workflows occupying the Actions queue.
  cancel-in-progress: true

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      run_cuda:
        description: 'Run CUDA tests (requires org GPU runner; not configured today)'
        type: boolean
        default: false

  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'static/DOCS.md'
      - 'docs/**'
      - 'examples/**/README.md'

  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'static/DOCS.md'
      - 'docs/**'
      - 'examples/**/README.md'

jobs:
  run-tests-on-linux:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VJOBS: '2'

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            flags: ""
          - os: ubuntu-24.04
            flags: ""
          - os: ubuntu-24.04
            flags: "--prod"

    steps:
      - name: Checkout VSL
        id: checkout_vsl
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: vsl

      - name: Setup V
        id: setup_v
        if: ${{ !cancelled() && steps.checkout_vsl.outcome == 'success' }}
        uses: vlang/setup-v@663cc08827d1fc0532ee755b4dedbb183c11d06a # v1.7
        with:
          check-latest: true

      - name: Move VSL source code to V Modules
        id: move_vsl_source_code_to_v_modules
        if: ${{ !cancelled() && steps.setup_v.outcome == 'success' }}
        run: |
          mkdir -p ~/.vmodules
          mv ./vsl ~/.vmodules/vsl

      - name: V doctor
        id: v_doctor
        if: ${{ !cancelled() && steps.move_vsl_source_code_to_v_modules.outcome == 'success' }}
        run: |
          cd ~/.vmodules
          env HOME="$HOME" PATH="$PATH" VJOBS=2 v doctor

      - name: Install dependencies
        id: install_dependencies
        if: ${{ !cancelled() && steps.v_doctor.outcome == 'success' }}
        run: |
          sudo apt-get update && \
          sudo apt-get install --quiet -y --no-install-recommends \
            gfortran \
            libxi-dev \
            libxcursor-dev \
            mesa-common-dev \
            liblapacke-dev \
            libopenblas-dev \
            libgc-dev \
            libgl1-mesa-dev \
            libopenmpi-dev \
            libhdf5-dev \
            hdf5-tools \
            opencl-headers \
            ocl-icd-opencl-dev \
            pocl-opencl-icd \
            vulkan-tools \
            mesa-vulkan-drivers \
            libvulkan-dev

      - name: Test OpenCL compute backend
        if: matrix.os == 'ubuntu-24.04' && matrix.flags == ''
        env:
          VJOBS: '2'
        run: |
          cd ~/.vmodules
          env HOME="$HOME" PATH="$PATH" VJOBS=2 \
            v -d vcl test vsl/vcl/compute

      - name: Test opt-in MPI API
        if: matrix.os == 'ubuntu-24.04' && matrix.flags == ''
        working-directory: /home/runner/.vmodules
        env:
          VJOBS: 2
        run: |
          env HOME="$HOME" PATH="$PATH" VJOBS=2 \
            v -d vsl_mpi -cc gcc test ./vsl/mpi
          env HOME="$HOME" PATH="$PATH" VJOBS=2 \
            mpirun --oversubscribe -n 2 v -d vsl_mpi -cc gcc run ./vsl/mpi/examples/roundtrip/main.v

      - name: Execute Tests using Pure V Backend
        id: execute_tests_using_pure_v_backend
        if: ${{ !cancelled() && steps.install_dependencies.outcome == 'success' }}
        run: |
          cd ~/.vmodules
          env HOME="$HOME" PATH="$PATH" VJOBS=2 v wipe-cache
          env HOME="$HOME" PATH="$PATH" VJOBS=2 TERM="$TERM" \
            "$HOME/.vmodules/vsl/bin/test" ${{ matrix.flags }} --use-cblas

      - name: Execute Tests using Pure V Backend with Pure C Backend
        id: execute_tests_using_pure_v_backend_with_pure_c_backend
        if: ${{ !cancelled() && steps.execute_tests_using_pure_v_backend.outcome == 'success' }}
        run: |
          cd ~/.vmodules
          env HOME="$HOME" PATH="$PATH" VJOBS=2 v wipe-cache
          env HOME="$HOME" PATH="$PATH" VJOBS=2 TERM="$TERM" \
            "$HOME/.vmodules/vsl/bin/test" ${{ matrix.flags }} --use-cblas --use-lapacke

      - name: Execute Tests using Vulkan Compute Backend
        id: execute_tests_using_vulkan_compute_backend
        if: ${{ !cancelled() && steps.execute_tests_using_pure_v_backend_with_pure_c_backend.outcome == 'success' }}
        env:
          VSL_TEST_VULKAN: '1'
        run: |
          cd ~/.vmodules
          env HOME="$HOME" PATH="$PATH" VJOBS=2 TERM="$TERM" VSL_TEST_VULKAN=1 v wipe-cache
          env HOME="$HOME" PATH="$PATH" VJOBS=2 TERM="$TERM" VSL_TEST_VULKAN=1 \
            "$HOME/.vmodules/vsl/bin/test" ${{ matrix.flags }} --use-vulkan

  run-windows-smoke:
    name: Windows portable test suites
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Stop a failing test session at its first failure instead of
      # running the whole suite to completion; the remaining files
      # add no signal.
      VTEST_FAIL_FAST: '1'
      VJOBS: '2'

    steps:
      - name: Checkout VSL
        id: checkout_vsl
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: vsl

      - name: Install official V release binary (Windows)
        id: install_official_v_release_binary_windows
        if: ${{ !cancelled() && steps.checkout_vsl.outcome == 'success' }}
        shell: pwsh
        run: |
          # setup-v's source bootstrap currently fails on Windows.
          # Use the official release binary and verify its pinned digest.
          $version = '0.5.2'
          $expectedSha256 = (
            '5f1d619b6b04a2b54b4ad21826a25bdc' +
            'ba2acf75a941c8f72fc95672b6b064ca'
          )
          $archive = Join-Path $env:RUNNER_TEMP 'v_windows.zip'
          $installRoot = Join-Path $env:RUNNER_TEMP 'vlang'
          $releaseUri = "https://github.com/vlang/v/releases/download/$version"
          $uri = "$releaseUri/v_windows.zip"
          Invoke-WebRequest -Uri $uri -OutFile $archive
          $archiveHash = Get-FileHash -Path $archive -Algorithm SHA256
          $actualSha256 = $archiveHash.Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "V archive SHA-256 mismatch: $actualSha256"
          }
          Expand-Archive -LiteralPath $archive `
            -DestinationPath $installRoot -Force
          $vDirectory = Join-Path $installRoot 'v'
          if (-not (Test-Path (Join-Path $vDirectory 'v.exe'))) {
            throw 'The official V release archive does not contain v.exe'
          }
          $vDirectory | Out-File -FilePath $env:GITHUB_PATH `
            -Append -Encoding utf8
          $vExecutable = Join-Path $vDirectory 'v.exe'
          & $vExecutable version

      - name: Move VSL source code to V Modules
        id: move_vsl_source_code_to_v_modules
        if: ${{ !cancelled() && steps.install_official_v_release_binary_windows.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p ~/.vmodules
          mv ./vsl ~/.vmodules/vsl

      - name: V doctor
        id: v_doctor
        if: ${{ !cancelled() && steps.move_vsl_source_code_to_v_modules.outcome == 'success' }}
        shell: bash
        run: |
          cd ~/.vmodules
          v doctor

      - name: Validate portable test runner
        id: validate_portable_test_runner
        if: ${{ !cancelled() && steps.v_doctor.outcome == 'success' }}
        shell: bash
        run: |
          cd ~/.vmodules
          bash -n vsl/bin/test
          bash -n vsl/bin/test-windows
          vsl/bin/test --help
          vsl/bin/test-windows --check

      - name: Install Vulkan headers (Windows)
        id: install_vulkan_headers_windows
        if: ${{ !cancelled() && steps.validate_portable_test_runner.outcome == 'success' }}
        uses: humbletim/setup-vulkan-sdk@c25f41106918cde0bf347e6f201277392b3a9e9d # v1.2.1
        with:
          vulkan-query-version: 1.3.296.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Run Windows compute smoke
        id: run_windows_compute_smoke
        if: ${{ !cancelled() && steps.install_vulkan_headers_windows.outcome == 'success' }}
        shell: bash
        run: |
          cd ~/.vmodules
          vulkan_root="${VULKAN_SDK//\\//}"
          export CFLAGS="-I${vulkan_root}/Include"
          export LIB="${vulkan_root}/Lib"
          cat > "$RUNNER_TEMP/vsl_windows_smoke.v" <<'EOF'
          import vsl.compute

          fn main() {
            assert compute.op_supported(.cpu, 'gemm')
          }
          EOF
          v run "$RUNNER_TEMP/vsl_windows_smoke.v"
          v test vsl/compute/context_test.v

      - name: Run portable Windows test suites
        id: run_portable_windows_test_suites
        if: ${{ !cancelled() && steps.run_windows_compute_smoke.outcome == 'success' }}
        shell: bash
        run: |
          cd ~/.vmodules
          vsl/bin/test-windows

      - name: Test Vulkan compute on Windows
        id: test_vulkan_compute_on_windows
        if: ${{ !cancelled() && steps.run_portable_windows_test_suites.outcome == 'success' }}
        shell: bash
        run: |
          cd ~/.vmodules
          vulkan_root="${VULKAN_SDK//\\//}"
          export CFLAGS="-I${vulkan_root}/Include"
          export LIB="${vulkan_root}/Lib"
          v test ./vsl/vulkan/compute

  run-tests-on-cuda:
    # CUDA needs an org larger/GPU runner (label was linux-x64-16c). Standard GitHub
    # hosted runners have no NVIDIA GPU. Do not run on main push — it queues forever
    # when no matching runner exists. Local: ./bin/test --use-cuda
    if: github.event_name == 'workflow_dispatch' && inputs.run_cuda == true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VJOBS: '2'

    steps:
      - name: Checkout VSL
        id: checkout_vsl
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: vsl

      - name: Setup V
        id: setup_v
        if: ${{ !cancelled() && steps.checkout_vsl.outcome == 'success' }}
        uses: vlang/setup-v@663cc08827d1fc0532ee755b4dedbb183c11d06a # v1.7
        with:
          check-latest: true

      - name: Move VSL source code to V Modules
        id: move_vsl_source_code_to_v_modules
        if: ${{ !cancelled() && steps.setup_v.outcome == 'success' }}
        run: |
          mkdir -p ~/.vmodules
          mv ./vsl ~/.vmodules/vsl

      - name: V doctor
        id: v_doctor
        if: ${{ !cancelled() && steps.move_vsl_source_code_to_v_modules.outcome == 'success' }}
        run: |
          cd ~/.vmodules
          env HOME="$HOME" PATH="$PATH" VJOBS=2 v doctor

      - name: Install CUDA toolkit
        id: install_cuda_toolkit
        if: ${{ !cancelled() && steps.v_doctor.outcome == 'success' }}
        run: |
          sudo apt-get update && \
          sudo apt-get install --quiet -y --no-install-recommends \
            cuda-toolkit-12-2 \
            libcudnn8 libcudnn8-dev

      - name: Verify CUDA installation
        id: verify_cuda_installation
        if: ${{ !cancelled() && steps.install_cuda_toolkit.outcome == 'success' }}
        run: |
          nvcc --version
          nvidia-smi || echo "nvidia-smi not available in container (expected on some runners)"

      - name: Execute Tests using CUDA Backend
        id: execute_tests_using_cuda_backend
        if: ${{ !cancelled() && steps.verify_cuda_installation.outcome == 'success' }}
        run: |
          cd ~/.vmodules
          if ! command -v nvidia-smi >/dev/null 2>&1 || ! nvidia-smi -L >/dev/null 2>&1; then
            echo "::notice::Skipping CUDA tests: no NVIDIA GPU is visible to this runner."
            exit 0
          fi
          env HOME="$HOME" PATH="$PATH" VJOBS=2 v wipe-cache
          env HOME="$HOME" PATH="$PATH" VJOBS=2 TERM="$TERM" \
            "$HOME/.vmodules/vsl/bin/test" --use-cuda
          # Once a GPU is detected, compilation and numerical test failures fail the job.
          env HOME="$HOME" PATH="$PATH" VJOBS=2 \
            env VSL_TEST_CUDA=1 v -d cuda -d cudnn_layernorm test vsl/cuda/compute/numerical_validation_test.v

  run-tests-on-macos:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      VJOBS: '2'

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            flags: ""
          - os: macos-latest
            flags: "--prod"

    steps:
      - name: Checkout VSL
        id: checkout_vsl
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: vsl

      - name: Setup V
        if: ${{ !cancelled() && steps.checkout_vsl.outcome == 'success' }}
        id: setup_v
        if: ${{ !cancelled() && steps.checkout_vsl.outcome == 'success' }}
        uses: vlang/setup-v@663cc08827d1fc0532ee755b4dedbb183c11d06a # v1.7
        with:
          check-latest: true

      - name: Move VSL source code to V Modules
        if: ${{ !cancelled() && steps.setup_v.outcome == 'success' }}
        id: move_vsl_source_code_to_v_modules
        if: ${{ !cancelled() && steps.setup_v.outcome == 'success' }}
        run: |
          mkdir -p ~/.vmodules
          mv ./vsl ~/.vmodules/vsl

      - name: V doctor
        if: ${{ !cancelled() && steps.move_vsl_source_code_to_v_modules.outcome == 'success' }}
        id: v_doctor
        if: ${{ !cancelled() && steps.move_vsl_source_code_to_v_modules.outcome == 'success' }}
        run: |
          cd ~/.vmodules
          v doctor

      - name: Install dependencies
        if: ${{ !cancelled() && steps.v_doctor.outcome == 'success' }}
        id: install_dependencies
        if: ${{ !cancelled() && steps.v_doctor.outcome == 'success' }}
        run: |
          brew install coreutils
          brew install gcc
          brew install libomp
          brew install hdf5
          brew install open-mpi
          brew install openblas
          brew install lapack
          brew install opencl-headers
          brew install vulkan-headers

      - name: Export Homebrew BLAS/LAPACK paths
        if: ${{ !cancelled() && steps.install_dependencies.outcome == 'success' }}
        id: export_homebrew_blas_lapack_paths
        if: ${{ !cancelled() && steps.install_dependencies.outcome == 'success' }}
        run: |
          OPENBLAS_PREFIX="$(brew --prefix openblas)"
          LAPACK_PREFIX="$(brew --prefix lapack)"
          {
            echo "CPPFLAGS=-I${OPENBLAS_PREFIX}/include -I${LAPACK_PREFIX}/include ${CPPFLAGS:-}"
            echo "CFLAGS=-I${OPENBLAS_PREFIX}/include -I${LAPACK_PREFIX}/include ${CFLAGS:-}"
            echo "LDFLAGS=-L${OPENBLAS_PREFIX}/lib -L${LAPACK_PREFIX}/lib ${LDFLAGS:-}"
            echo "PKG_CONFIG_PATH=${OPENBLAS_PREFIX}/lib/pkgconfig:${LAPACK_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          } >> "$GITHUB_ENV"

      - name: Execute Tests using Pure V Backend
        if: ${{ !cancelled() && steps.export_homebrew_blas_lapack_paths.outcome == 'success' }}
        id: execute_tests_using_pure_v_backend
        if: ${{ !cancelled() && steps.export_homebrew_blas_lapack_paths.outcome == 'success' }}
        run: |
          cd ~/.vmodules
          v wipe-cache
          vsl/bin/test

      - name: Execute Tests using Pure V Backend with Pure C Backend
        if: ${{ !cancelled() && steps.execute_tests_using_pure_v_backend.outcome == 'success' }}
        id: execute_tests_using_pure_v_backend_with_pure_c_backend
        if: ${{ !cancelled() && steps.execute_tests_using_pure_v_backend.outcome == 'success' }}
        run: |
          cd ~/.vmodules
          v wipe-cache
          vsl/bin/test --use-cblas --use-lapacke
