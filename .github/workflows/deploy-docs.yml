name: Deploy Documentation

permissions:
  contents: write

env:
  VJOBS: '2'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main

jobs:
  deploy-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VSL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: vsl

      - name: Setup V
        uses: vlang/setup-v@663cc08827d1fc0532ee755b4dedbb183c11d06a # v1.7
        with:
          check-latest: true

      - name: Copy VSL to V Modules
        run: |
          mkdir -p ~/.vmodules
          cp -a ./vsl ~/.vmodules/vsl

      - name: V doctor
        env:
          VJOBS: '2'
        run: |
          cd ~/.vmodules
          env HOME="$HOME" PATH="$PATH" VJOBS=2 v doctor

      - name: Build docs
        run: |
          cd ~/.vmodules/vsl
          rm -rf examples
          rm -f README.md
          mv static/DOCS.md README.md
          cd ~/.vmodules
          env HOME="$HOME" PATH="$PATH" VJOBS=2 \
            v doc -readme -m -f html ./vsl

      - name: Stage website and generated API docs
        run: |
          rm -rf ./vsl/_site
          mkdir -p ./vsl/_site/api
          cp -a ./vsl/website/. ./vsl/_site/
          cp -a ~/.vmodules/vsl/_docs/. ./vsl/_site/api/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./vsl/_site/
