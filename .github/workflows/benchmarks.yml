name: VSL Performance Benchmarks

env:
  VJOBS: 2

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Run on schedule (weekly on Monday at 2 AM UTC)
  schedule:
    - cron: '0 2 * * 1'

  # Run on pushes to main and release branches
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - 'benchmarks/**/*.v'
      - 'benchmarks/**/*.py'
      - 'blas/**/*.v'
      - 'lapack/**/*.v'
      - 'fft/**/*.v'
      - '.github/workflows/benchmarks.yml'

jobs:
  run-benchmarks-linux:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-22.04
        backend:
          - name: "Pure V"
            id: "pure_v"
            flags: ""
          - name: "Pure V BLAS + LAPACKE"
            id: "pure_v_blas_lapacke"
            flags: "-d vsl_lapack_lapacke"
          - name: "OpenBLAS + Pure V LAPACK"
            id: "openblas_pure_v_lapack"
            flags: "-d vsl_blas_cblas"
          - name: "OpenBLAS + LAPACKE"
            id: "openblas_lapacke"
            flags: "-d vsl_blas_cblas -d vsl_lapack_lapacke"

    steps:
      - name: Checkout VSL
        uses: actions/checkout@v7
        with:
          path: vsl

      - name: Setup V
        uses: vlang/setup-v@v1.7
        with:
          check-latest: true

      - name: V doctor
        run: sudo systemd-run --scope --property=MemoryMax=512M --setenv=HOME=$HOME --setenv=PATH=$PATH -- env HOME=$HOME VJOBS=2 v doctor

      - name: Install dependencies
        run: |
          sudo apt-get update && \
          sudo apt-get install --quiet -y --no-install-recommends \
            gfortran \
            libxi-dev \
            libxcursor-dev \
            mesa-common-dev \
            liblapacke-dev \
            libopenblas-dev \
            libgc-dev \
            libgl1-mesa-dev \
            libopenmpi-dev \
            libhdf5-dev \
            hdf5-tools \
            opencl-headers \
            ocl-icd-opencl-dev

      - name: Move VSL source code to V Modules
        run: mv ./vsl ~/.vmodules

      - name: Run BLAS Benchmarks (${{ matrix.backend.name }})
        run: |
          set -o pipefail
          echo "=========================================="
          echo "Running BLAS benchmarks"
          echo "Backend: ${{ matrix.backend.name }}"
          echo "Flags: ${{ matrix.backend.flags }}"
          echo "OS: ${{ matrix.os }}"
          echo "=========================================="
          cd ~/.vmodules && \
          sudo systemd-run --scope --property=MemoryMax=2G --setenv=HOME=$HOME --setenv=PATH=$PATH -- env HOME=$HOME VJOBS=2 v ${{ matrix.backend.flags }} run vsl/benchmarks/blas_bench.v 2>&1 | tee blas_bench_${{ matrix.backend.id }}.log

      - name: Run LAPACK Benchmarks (${{ matrix.backend.name }})
        run: |
          set -o pipefail
          echo "=========================================="
          echo "Running LAPACK benchmarks"
          echo "Backend: ${{ matrix.backend.name }}"
          echo "Flags: ${{ matrix.backend.flags }}"
          echo "OS: ${{ matrix.os }}"
          echo "=========================================="
          cd ~/.vmodules && \
          sudo systemd-run --scope --property=MemoryMax=2G --setenv=HOME=$HOME --setenv=PATH=$PATH -- env HOME=$HOME VJOBS=2 v ${{ matrix.backend.flags }} run vsl/benchmarks/lapack_bench.v 2>&1 | tee lapack_bench_${{ matrix.backend.id }}.log

      - name: Run Backend Comparison (${{ matrix.backend.name }})
        run: |
          set -o pipefail
          echo "=========================================="
          echo "Running backend comparison"
          echo "Backend: ${{ matrix.backend.name }}"
          echo "Flags: ${{ matrix.backend.flags }}"
          echo "OS: ${{ matrix.os }}"
          echo "=========================================="
          cd ~/.vmodules && \
          sudo systemd-run --scope --property=MemoryMax=2G --setenv=HOME=$HOME --setenv=PATH=$PATH -- env HOME=$HOME VJOBS=2 v ${{ matrix.backend.flags }} run vsl/benchmarks/compare_backends.v 2>&1 | tee compare_backends_${{ matrix.backend.id }}.log

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ matrix.os }}-${{ matrix.backend.id }}
          path: |
            ~/.vmodules/blas_bench_${{ matrix.backend.id }}.log
            ~/.vmodules/lapack_bench_${{ matrix.backend.id }}.log
            ~/.vmodules/compare_backends_${{ matrix.backend.id }}.log
          retention-days: 30

  run-benchmarks-macos:
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        backend:
          - name: "Pure V"
            id: "pure_v"
            flags: ""
          - name: "Pure V BLAS + LAPACKE"
            id: "pure_v_blas_lapacke"
            flags: "-d vsl_lapack_lapacke"
          - name: "OpenBLAS + Pure V LAPACK"
            id: "openblas_pure_v_lapack"
            flags: "-d vsl_blas_cblas"
          - name: "OpenBLAS + LAPACKE"
            id: "openblas_lapacke"
            flags: "-d vsl_blas_cblas -d vsl_lapack_lapacke"

    steps:
      - name: Checkout VSL
        uses: actions/checkout@v7
        with:
          path: vsl

      - name: Setup V
        uses: vlang/setup-v@v1.7
        with:
          check-latest: true

      - name: V doctor
        run: env VJOBS=2 v doctor

      - name: Install dependencies
        run: |
          brew install coreutils
          brew install gcc
          brew install libomp
          brew install hdf5
          brew install open-mpi
          brew install openblas
          brew install lapack
          brew install opencl-headers

      - name: Move VSL source code to V Modules
        run: mv ./vsl ~/.vmodules

      - name: Run BLAS Benchmarks (${{ matrix.backend.name }})
        run: |
          set -o pipefail
          echo "=========================================="
          echo "Running BLAS benchmarks"
          echo "Backend: ${{ matrix.backend.name }}"
          echo "Flags: ${{ matrix.backend.flags }}"
          echo "OS: macOS"
          echo "=========================================="
          cd ~/.vmodules && \
          env VJOBS=2 v ${{ matrix.backend.flags }} run vsl/benchmarks/blas_bench.v 2>&1 | tee blas_bench_${{ matrix.backend.id }}.log

      - name: Run LAPACK Benchmarks (${{ matrix.backend.name }})
        run: |
          set -o pipefail
          echo "=========================================="
          echo "Running LAPACK benchmarks"
          echo "Backend: ${{ matrix.backend.name }}"
          echo "Flags: ${{ matrix.backend.flags }}"
          echo "OS: macOS"
          echo "=========================================="
          cd ~/.vmodules && \
          env VJOBS=2 v ${{ matrix.backend.flags }} run vsl/benchmarks/lapack_bench.v 2>&1 | tee lapack_bench_${{ matrix.backend.id }}.log

      - name: Run Backend Comparison (${{ matrix.backend.name }})
        run: |
          set -o pipefail
          echo "=========================================="
          echo "Running backend comparison"
          echo "Backend: ${{ matrix.backend.name }}"
          echo "Flags: ${{ matrix.backend.flags }}"
          echo "OS: macOS"
          echo "=========================================="
          cd ~/.vmodules && \
          env VJOBS=2 v ${{ matrix.backend.flags }} run vsl/benchmarks/compare_backends.v 2>&1 | tee compare_backends_${{ matrix.backend.id }}.log

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-macos-${{ matrix.backend.id }}
          path: |
            ~/.vmodules/blas_bench_${{ matrix.backend.id }}.log
            ~/.vmodules/lapack_bench_${{ matrix.backend.id }}.log
            ~/.vmodules/compare_backends_${{ matrix.backend.id }}.log
          retention-days: 30

  vs-numpy-benchmarks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout VSL
        uses: actions/checkout@v7
        with:
          path: vsl

      - name: Setup V
        uses: vlang/setup-v@v1.7
        with:
          check-latest: true

      - name: Install dependencies
        run: |
          sudo apt-get update && \
          sudo apt-get install --quiet -y --no-install-recommends \
            libopenblas-dev liblapacke-dev gfortran python3 python3-numpy

      - name: Move VSL to modules
        run: mv ./vsl ~/.vmodules

      - name: Run vs NumPy harness (#282)
        run: |
          cd ~/.vmodules
          set -o pipefail
          sudo systemd-run --scope --property=MemoryMax=2G --setenv=HOME=$HOME --setenv=PATH=$PATH -- env HOME=$HOME VJOBS=2 v -d vsl_blas_cblas run vsl/benchmarks/vs_numpy/matmul_bench.v | tee vs_numpy_matmul.log
          sudo systemd-run --scope --property=MemoryMax=2G --setenv=HOME=$HOME --setenv=PATH=$PATH -- env HOME=$HOME VJOBS=2 v -d vsl_blas_cblas run vsl/benchmarks/vs_numpy/gemv_bench.v | tee vs_numpy_gemv.log
          sudo systemd-run --scope --property=MemoryMax=2G --setenv=HOME=$HOME --setenv=PATH=$PATH -- env HOME=$HOME VJOBS=2 v run vsl/benchmarks/vs_numpy/conv2d_bench.v | tee vs_numpy_conv2d.log
          sudo systemd-run --scope --property=MemoryMax=1G --setenv=HOME=$HOME --setenv=PATH=$PATH -- env HOME=$HOME VJOBS=2 python3 vsl/benchmarks/vs_numpy/numpy_baseline.py matmul | tee -a vs_numpy_matmul.log
          sudo systemd-run --scope --property=MemoryMax=1G --setenv=HOME=$HOME --setenv=PATH=$PATH -- env HOME=$HOME VJOBS=2 python3 vsl/benchmarks/vs_numpy/numpy_baseline.py gemv | tee -a vs_numpy_gemv.log

      - name: Upload vs_numpy logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vs-numpy-benchmark-logs
          path: ~/.vmodules/vs_numpy_*.log
          retention-days: 14

  fft-mpi-benchmarks:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        benchmark: [fft, mpi]
    steps:
      - name: Checkout VSL
        uses: actions/checkout@v7
        with:
          path: vsl

      - name: Setup V
        uses: vlang/setup-v@v1.7
        with:
          check-latest: true

      - name: Install FFT comparison dependencies
        if: matrix.benchmark == 'fft'
        run: |
          sudo apt-get update
          sudo apt-get install --quiet -y --no-install-recommends python3 python3-numpy

      - name: Install MPI dependencies
        if: matrix.benchmark == 'mpi'
        run: |
          sudo apt-get update
          sudo apt-get install --quiet -y --no-install-recommends libopenmpi-dev openmpi-bin

      - name: Move VSL to modules
        run: mv ./vsl ~/.vmodules

      - name: Run FFT vs NumPy benchmark
        if: matrix.benchmark == 'fft'
        run: |
          cd ~/.vmodules
          set -o pipefail
          sudo systemd-run --scope --property=MemoryMax=1G --setenv=HOME=$HOME --setenv=PATH=$PATH -- env HOME=$HOME VJOBS=2 v run vsl/benchmarks/fft_bench.v | tee fft_bench.log
          sudo systemd-run --scope --property=MemoryMax=1G --setenv=HOME=$HOME --setenv=PATH=$PATH -- env HOME=$HOME VJOBS=2 python3 vsl/benchmarks/fft_numpy_baseline.py | tee -a fft_bench.log

      - name: Run MPI latency benchmark
        if: matrix.benchmark == 'mpi'
        run: |
          cd ~/.vmodules
          sudo systemd-run --scope --property=MemoryMax=1G --setenv=HOME=$HOME --setenv=PATH=$PATH -- env HOME=$HOME VJOBS=2 v -d vsl_mpi -cc gcc -o /tmp/vsl-mpi-bench vsl/benchmarks/mpi_bench.v
          sudo systemd-run --scope --property=MemoryMax=1G --setenv=HOME=$HOME --setenv=PATH=$PATH -- env HOME=$HOME VJOBS=2 mpirun --oversubscribe -n 2 /tmp/vsl-mpi-bench | tee mpi_bench.log

      - name: Upload FFT benchmark results
        if: always() && matrix.benchmark == 'fft'
        uses: actions/upload-artifact@v7
        with:
          name: fft-benchmark-logs
          path: ~/.vmodules/fft_bench.log
          retention-days: 14

      - name: Upload MPI benchmark results
        if: always() && matrix.benchmark == 'mpi'
        uses: actions/upload-artifact@v7
        with:
          name: mpi-benchmark-logs
          path: ~/.vmodules/mpi_bench.log
          retention-days: 14
