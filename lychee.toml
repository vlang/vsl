# Link checking for public documentation. Organization project pages require
# GitHub access and are intentionally left out of unauthenticated link checks.
exclude = [
  '^https://github\.com/orgs/vlang/projects/8(?:/.*)?$',
  '^https://hub\.docker\.com/r/ulisesjeremias/vsl$',
  # API pages are generated by deploy-docs and are not present in the checkout.
  '^file://.*/website/api(?:/.*)?$',
  # Checked separately so only GNU's documented 429 rate limit is non-blocking.
  '^https://www\.gnu\.org/software/gsl/doc/html(?:/.*)?$',
]

# Keep retries bounded without accepting timeouts or rate limits as success.
timeout = 30
max_retries = 2
retry_wait_time = 2

# Keep any other GNU links serialized.
[hosts."www.gnu.org"]
concurrency = 1
request_interval = "10s"

# The parity tracker references many GitHub issues; avoid bursty unauthenticated requests.
[hosts."github.com"]
concurrency = 1
request_interval = "1s"
