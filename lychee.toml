# Link checking for public documentation. Organization project pages require
# GitHub access and are intentionally left out of unauthenticated link checks.
exclude = [
  '^https://github\.com/orgs/vlang/projects/8(?:/.*)?$',
  '^https://hub\.docker\.com/r/ulisesjeremias/vsl$',
]

# Retry slow documentation hosts without accepting timeouts as success.
timeout = 30
max_retries = 2
retry_wait_time = 2

[hosts."www.gnu.org"]
concurrency = 1
request_interval = "2s"
# GNU.org rate-limits automated link checks; serialize requests and wait between them.

# The parity tracker references many GitHub issues; avoid bursty unauthenticated requests.
[hosts."github.com"]
concurrency = 1
request_interval = "1s"
