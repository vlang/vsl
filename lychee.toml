# Link checking for public documentation. Organization project pages require
# GitHub access and are intentionally left out of unauthenticated link checks.
exclude = [
  '^https://github\.com/orgs/vlang/projects/8(?:/.*)?$',
  '^https://hub\.docker\.com/r/ulisesjeremias/vsl$',
  # API pages are generated by deploy-docs and are not present in the checkout.
  '^file://.*/website/api(?:/.*)?$',
]

# Retry slow documentation hosts without accepting timeouts as success.
timeout = 30
max_retries = 2
retry_wait_time = 2

# The GNU GSL manual rate-limits concurrent CI checks.
[hosts."www.gnu.org"]
concurrency = 1
request_interval = "2s"
